apply plugin: 'com.android.application'

android {
    compileSdk 36

    defaultConfig {
        applicationId "by.instruction.papera"
        minSdk 26
        targetSdk 36
        versionCode 84
        versionName "7.0.0"

// Поддержка страниц памяти 16 КБ
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Поддержка новых архитектур с 16 КБ страницами
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Документы из assets читаются с диска — больше heap для крупных DOCX
                jvmArgs '-Xmx2g'
                // Полный прогон по разделам может занимать несколько минут
                timeout = java.time.Duration.ofMinutes(20)
            }
        }
    }

    namespace 'by.instruction.papera'
}

// Удаляем устаревшие dex-архивы перед сборкой, чтобы не накапливались дубликаты
def cleanProjectDex = tasks.register("cleanProjectDex", Delete) {
    delete "$buildDir/intermediates/project_dex_archive"
}

afterEvaluate {
    tasks.matching { it.name.startsWith("mergeProjectDex") }.configureEach {
        dependsOn cleanProjectDex
    }
}

dependencies {
    // Apache POI для работы с DOC и DOCX файлами (требует minSdk 26+)
    implementation 'org.apache.poi:poi-scratchpad:5.2.3'
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    
    // Material 1.14: корректнее edge-to-edge на API 35+ (без устаревших bar-color API в диалогах)
    implementation 'com.google.android.material:material:1.14.0'
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    implementation 'androidx.core:core:1.16.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'androidx.cardview:cardview:1.0.0'
}